name: Build JumpVNC

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-linux:
    name: Server / Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Debian 13 supplies FFmpeg 7 and the X11 build/runtime dependencies.
    container: debian:trixie-slim
    timeout-minutes: 25
    steps:
      - name: Install build and desktop test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential cmake pkg-config \
            libjpeg62-turbo-dev zlib1g-dev libavcodec-dev libavutil-dev libswscale-dev ffmpeg \
            libx11-dev libxtst-dev libxfixes-dev \
            xvfb xterm xdotool xauth xclip tigervnc-tools tigervnc-viewer \
            tigervnc-scraping-server openssh-client iproute2 xfonts-base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Trust the runner-owned checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test Agent
        run: |
          go test -race ./...
          go vet ./...
      - name: Build Agent and X11 backend
        run: |
          go build -trimpath -o bin/sshvnc ./cmd/server
          sh desktop/linux/prepare-sources.sh
          cmake -S desktop/linux -B build/linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux --target svnc-desktop h264-smoke --parallel 2
          build/linux/h264-smoke software
          build/linux/h264-smoke auto
          go test -c -o /tmp/svnc-rfb.test ./tests/integration
      - name: Test desktop, clipboard and SFTP in isolated Xvfb sessions
        run: |
          useradd --create-home --shell /bin/bash svnc-ci
          runuser -u svnc-ci -- env SVNC_RFB_TEST_BINARY=/tmp/svnc-rfb.test SVNC_TEST_H264=1 \
            bash tests/integration/libvncserver.sh bin/sshvnc build/linux/svnc-desktop
          runuser -u svnc-ci -- env SVNC_RFB_TEST_BINARY=/tmp/svnc-rfb.test \
            SVNC_TEST_H264_ODD_GEOMETRY=1 SVNC_TEST_DESKTOP_GEOMETRY=801x601x24 \
            bash tests/integration/libvncserver.sh bin/sshvnc build/linux/svnc-desktop
          runuser -u svnc-ci -- bash tests/integration/tigervnc.sh bin/sshvnc
      - name: Package Linux server
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          package="jumpvnc-server-linux-$ARCH"
          mkdir -p "dist/$package/bin" "dist/$package/sources"
          cp bin/sshvnc "dist/$package/bin/"
          cmake --install build/linux --prefix "$PWD/dist/$package"
          cp -R configs deployments docs "dist/$package/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "dist/$package/"
          cp desktop/linux/README.md "dist/$package/BACKEND.md"
          go mod vendor -o "$PWD/dist/$package/sources/go-vendor"
          git -C desktop/linux/libvncserver archive --format=tar.gz --output="$PWD/dist/$package/sources/libvncserver.tar.gz" HEAD
          git archive --format=tar.gz --output="$PWD/dist/$package/sources/jumpvnc.tar.gz" HEAD
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          cd dist
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jumpvnc-server-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  server-windows:
    name: Server / Windows amd64
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test and build Agent
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./...
          go vet ./...
          go build -trimpath -o bin/sshvnc.exe ./cmd/server
      - name: Prepare pinned backend sources
        shell: bash
        run: sh desktop/windows/prepare-sources.sh
      - name: Build DXGI backend
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
          }
          ./desktop/windows/build.ps1
      - name: Check cursor wire format and keyboard scan codes
        shell: pwsh
        run: |
          cmake --build desktop/windows/build --config Release --target input-smoke cursor-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Cannot build cursor/input checks' }
          ./desktop/windows/build/Release/input-smoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'Keyboard scan-code check failed' }
          ./desktop/windows/build/Release/cursor-smoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'Cursor wire-format check failed' }
      - name: Package Windows server with matching sources and licenses
        shell: pwsh
        run: |
          $package = 'jumpvnc-server-windows-amd64'
          $root = Join-Path $PWD "dist/$package"
          New-Item -ItemType Directory -Force "$root/bin", "$root/backends/windows", "$root/sources", "$root/licenses" | Out-Null
          Copy-Item bin/sshvnc.exe "$root/bin/"
          Copy-Item desktop/windows/build/Release/svnc-desktop.exe "$root/backends/windows/"
          Copy-Item configs, deployments, docs $root -Recurse
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md $root
          Copy-Item desktop/windows/README.md "$root/BACKEND.md"
          go mod vendor -o "$root/sources/go-vendor"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot package matching Go dependency sources' }
          Copy-Item desktop/windows/COPYING "$root/licenses/LibVNCServer-COPYING"
          Copy-Item desktop/windows/jpeg/LICENSE.md "$root/licenses/libjpeg-turbo-LICENSE.md"
          Copy-Item desktop/windows/zlib/LICENSE "$root/licenses/zlib-LICENSE"
          git archive --format=tar.gz --output="$root/sources/jumpvnc.tar.gz" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot archive JumpVNC sources' }
          foreach ($dependency in @('libvncserver', 'jpeg', 'zlib')) {
            git -C "desktop/windows/$dependency" archive --format=tar.gz --output="$root/sources/$dependency.tar.gz" HEAD
            if ($LASTEXITCODE -ne 0) { throw "Cannot archive $dependency sources" }
          }
          Compress-Archive -Path $root -DestinationPath "dist/$package.zip"
          $hash = (Get-FileHash "dist/$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content "dist/$package.zip.sha256" -Encoding ascii
      - name: Build Windows setup executable
        shell: pwsh
        run: ./deployments/windows/installer/build.ps1
      - name: Check install, upgrade, management window and uninstall
        shell: pwsh
        run: ./deployments/windows/installer/test.ps1 -Installer ./dist/jumpvnc-server-windows-amd64-setup.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: jumpvnc-windows-management-check
          path: dist/jumpvnc-management.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jumpvnc-server-windows-amd64
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  client-macos:
    name: Viewer / macOS universal
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Test Viewer and frontend
        run: |
          npm --prefix frontend test
          go test -race ./...
          go vet ./...
      - name: Build universal app
        run: go tool mygo build -platform darwin/universal -skip-dmg
      - name: Verify and package app
        run: |
          app=build/darwin-universal/JumpVNC.app
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/JumpVNC" -verify_arch arm64 x86_64
          mkdir -p ../dist/jumpvnc-viewer-macos-universal/sources
          cp -R "$app" ../dist/jumpvnc-viewer-macos-universal/
          cp README.md ../dist/jumpvnc-viewer-macos-universal/
          cp ../LICENSE ../THIRD_PARTY_NOTICES.md ../dist/jumpvnc-viewer-macos-universal/
          go mod vendor -o "$PWD/../dist/jumpvnc-viewer-macos-universal/sources/go-vendor"
          cp -R frontend/node_modules/@novnc/novnc ../dist/jumpvnc-viewer-macos-universal/sources/novnc
          git archive --format=tar.gz --output="$PWD/../dist/jumpvnc-viewer-macos-universal/sources/jumpvnc.tar.gz" HEAD
          cd ../dist
          ditto -c -k --sequesterRsrc --keepParent jumpvnc-viewer-macos-universal jumpvnc-viewer-macos-universal.zip
          shasum -a 256 jumpvnc-viewer-macos-universal.zip > jumpvnc-viewer-macos-universal.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jumpvnc-viewer-macos-universal
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
