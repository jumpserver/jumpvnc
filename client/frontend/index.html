<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>JumpVNC · 连接管理</title>
  <link rel="stylesheet" href="./manager.css">
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2.5"/><path d="M8 21h8m-4-4v4"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 8V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8Z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.3.9-4.5 4.4 1.1 6.2-5.7-3-5.7 3 1.1-6.2L3.2 9.6l6.3-.9Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 0 0-13.5-3L3 8m0-5v5h5M4 16a8 8 0 0 0 13.5 3L21 16m0 5v-5h-5"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M8 4v16m-4-4 4 4 4-4M14 5h7m-7 5h5m-5 5h3"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 5h13M8 12h13M8 19h13M3 5h.01M3 12h.01M3 19h.01"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M6 18 18 6M6 6h12v12"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M6 8v.01M6 12v.01"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="m3 8 3-4h12l3 4v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Zm0 0h18M9 12h6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
  </defs></svg>
  <button id="sidebar-toggle" class="icon-button sidebar-toggle" type="button" title="收起侧栏" aria-label="收起侧栏" aria-controls="connection-sidebar" aria-expanded="true"><svg class="icon"><use href="#i-sidebar"/></svg></button>
  <aside id="connection-sidebar" class="sidebar" aria-label="连接分类">
    <div class="sidebar-titlebar"></div>
    <label class="search"><svg class="icon"><use href="#i-search"/></svg><input id="search" type="search" placeholder="搜索连接…" aria-label="搜索连接" autocomplete="off"><kbd>⌘ K</kbd></label>
    <nav class="navigation" aria-label="快速访问">
      <button class="nav-item selected" data-view="all" aria-current="page"><svg class="icon"><use href="#i-grid"/></svg><span>所有连接</span><span class="nav-count" id="all-count">0</span></button>
      <button class="nav-item" data-view="favorites"><svg class="icon"><use href="#i-star"/></svg><span>我的收藏</span><span class="nav-count" id="favorite-count">0</span></button>
    </nav>
    <div class="section-label"><span>自定义分类</span><button id="add-folder" class="icon-button" title="新建分类" aria-label="新建分类"><svg class="icon"><use href="#i-plus"/></svg></button></div>
    <nav id="folders" class="folder-navigation" aria-label="自定义分类"></nav>
    <div class="sidebar-footer">
      <details id="workspace-menu" class="workspace-menu">
        <summary class="workspace-button" title="本地工作空间"><span class="workspace-avatar" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="12" r="5.5"/><path d="M4 32v-2a12 10 0 0 1 24 0v2Z"/></svg></span><span class="workspace-label"><strong>本地工作空间</strong><span>连接配置保存在此设备</span></span><svg class="icon workspace-chevron"><use href="#i-chevron"/></svg></summary>
        <div class="workspace-popover"><div class="workspace-info"><strong>本地工作空间</strong><span id="workspace-count">正在读取连接…</span></div><button id="workspace-refresh" type="button"><svg class="icon"><use href="#i-refresh"/></svg>刷新连接</button><button id="workspace-add-folder" type="button"><svg class="icon"><use href="#i-plus"/></svg>新建分类</button></div>
      </details>
    </div>
  </aside>
  <main class="main">
    <header class="titlebar">
      <div class="breadcrumb"><svg class="icon" id="breadcrumb-icon"><use href="#i-grid"/></svg><span id="breadcrumb-name">所有连接</span></div>
      <div class="toolbar" aria-label="连接操作">
        <button id="refresh" class="icon-button" title="刷新连接" aria-label="刷新连接"><svg class="icon"><use href="#i-refresh"/></svg></button>
        <label class="sort-control" title="排序"><svg class="icon"><use href="#i-sort"/></svg><select id="sort" aria-label="连接排序"><option value="name">名称排序</option><option value="recent">最近打开</option><option value="created">最近添加</option></select></label>
        <button id="layout" class="icon-button" title="切换为列表视图" aria-label="切换为列表视图" aria-pressed="false"><svg class="icon"><use href="#i-list"/></svg></button>
        <span class="toolbar-divider"></span>
        <button id="import-connections" class="icon-button" type="button" title="导入 .svnc 连接" aria-label="导入 .svnc 连接"><svg class="icon"><use href="#i-import"/></svg></button>
        <button id="add-server" class="icon-button" type="button" title="添加连接" aria-label="添加连接"><svg class="icon"><use href="#i-plus"/></svg></button>
      </div>
    </header>
    <div class="content">
      <div class="page-heading"><div><div class="heading-line"><h1 id="page-title">所有连接</h1><span id="result-count" class="count-badge">0</span></div><p id="page-description">集中管理你的远程桌面。</p></div><div id="folder-actions" class="folder-actions" hidden><button id="rename-folder" class="text-button">重命名分类</button><button id="delete-folder" class="text-button">删除分类</button></div></div>
      <div id="error" class="error-banner" role="alert" hidden></div>
      <section id="servers" class="server-grid" aria-label="VNC 服务器"></section>
      <div id="empty" class="empty-state" hidden><div class="empty-art"><svg class="empty-monitor"><use href="#i-monitor"/></svg><span><svg class="icon"><use href="#i-plus"/></svg></span></div><h2 id="empty-title">添加你的第一个连接</h2><p id="empty-description">保存常用的 VNC 服务器，随时在独立窗口中连接。</p><button id="empty-add" class="icon-button" type="button" title="添加连接" aria-label="添加连接"><svg class="icon"><use href="#i-plus"/></svg></button></div>
    </div>
    <footer class="statusbar"><span id="status-count" aria-live="polite">正在读取连接…</span><span><svg class="icon"><use href="#i-arrow"/></svg>点击连接，在新窗口中打开</span></footer>
  </main>
  <dialog id="server-dialog" aria-labelledby="server-dialog-title">
    <form id="server-form">
      <div class="dialog-heading"><div><h2 id="server-dialog-title">添加连接</h2><p>保存服务器信息，在独立窗口中打开远程桌面。</p></div><button type="button" class="icon-button dialog-close" aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button></div>
      <div class="fields">
        <label class="wide">协议<span class="select-field"><select name="protocol"><option value="svnc">SVNC</option><option value="vnc">VNC</option></select></span></label>
        <label>连接名称<input name="name" required maxlength="100" placeholder="例如：设计工作站" autocomplete="off"></label>
        <label>所属分类<span class="select-field"><select name="folderId"></select></span></label>
        <label>服务器地址<input name="host" required placeholder="IP 地址或主机名" autocomplete="off"></label>
        <label>端口<input name="port" type="number" min="1" max="65535" placeholder="5922"></label>
        <label class="wide" data-user>用户名<input name="user" placeholder="vncuser" autocomplete="off"></label>
        <label class="wide">VNC 密码<input name="vncPassword" type="password" autocomplete="new-password" placeholder="可选，连接时填写"></label>
        <label class="checkbox-row wide"><input name="storedPassword" type="checkbox" checked>保存 VNC 密码</label>
        <label class="checkbox-row wide" data-vnc hidden><input name="sshTunnel" type="checkbox">使用 SSH 隧道</label>
        <label data-ssh-tunnel hidden>SSH 服务器<input name="sshHost" autocomplete="off" disabled></label>
        <label data-ssh-tunnel hidden>SSH 端口<input name="sshPort" type="number" min="1" max="65535" value="22" disabled></label>
        <label class="wide" data-ssh-tunnel hidden>SSH 用户名<input name="sshUser" autocomplete="off" disabled></label>
        <label class="wide" data-ssh-tunnel hidden>SSH 密码<input name="sshPassword" type="password" autocomplete="new-password" placeholder="可选，也可使用本机身份"></label>
        <label class="checkbox-row wide" data-ssh-tunnel hidden><input name="storedSSHPassword" type="checkbox" checked>保存 SSH 密码</label>
        <label class="wide" data-ssh-tunnel hidden>SSH 跳板机<input name="jump" placeholder="可选" autocomplete="off"></label>
        <label class="wide" data-ssh>SSH 私钥文件<input name="identity" placeholder="可选，默认使用本机身份" autocomplete="off"></label>
      </div>
      <input name="transport" type="hidden"><input name="knownHosts" type="hidden"><input name="hostKeyAlias" type="hidden"><input name="vncUsername" type="hidden">
      <p class="form-note"><svg class="icon"><use href="#i-lock"/></svg>账号、密码可留空，连接时补填。</p>
      <p id="server-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-buttons"><button type="button" class="dialog-close">取消</button><button id="save-server" class="primary" type="submit">保存连接</button></div>
    </form>
  </dialog>
  <dialog id="folder-dialog" aria-labelledby="folder-dialog-title"><form id="folder-form"><h2 id="folder-dialog-title">新建分类</h2><label>分类名称<input name="name" required maxlength="50" placeholder="例如：工作、个人、测试环境" autocomplete="off"></label><p id="folder-error" class="form-error" role="alert" hidden></p><div class="dialog-buttons"><button type="button" class="dialog-close">取消</button><button id="save-folder" class="primary" type="submit">创建分类</button></div></form></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><form id="confirm-form"><h2 id="confirm-title">删除连接？</h2><p id="confirm-description"></p><p id="confirm-error" class="form-error" role="alert" hidden></p><div class="dialog-buttons"><button type="button" class="dialog-close">取消</button><button id="confirm-delete" class="danger" type="submit">删除</button></div></form></dialog>
  <div id="toast" class="toast" role="status" hidden><svg class="icon"><use href="#i-check"/></svg><span></span></div>
  <script type="module" src="./manager.js"></script>
</body>
</html>
