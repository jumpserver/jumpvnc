[package]
name = "svnc-rustvncserver-evaluation"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rustvncserver = { version = "=2.2.1", path = "vendor/rustvncserver", features = ["turbojpeg"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
