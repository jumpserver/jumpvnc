ssh:
  listen: "0.0.0.0:5922"
  host_key_file: ssh_host_ed25519_key
  authorized_keys_file: authorized_keys
  user: vncuser
  allow_vnc: true

sftp:
  # To enable files, set read_write/read_only/write_only and specify a scoped root.
  # Do not use '~': a LocalSystem service's HOME is its system profile.
  mode: disabled
  # root: 'C:\Users\alice'

vnc:
  engine: libvncserver
  listen: "127.0.0.1:5900"
  executable: backends/windows/svnc-desktop.exe
  password_file: vnc-password.txt
  view_only: false
  compatibility:
    enabled: false

audit: true
