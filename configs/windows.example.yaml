ssh:
  listen: "0.0.0.0:2222"
  host_key_file: ssh_host_ed25519_key
  authorized_keys_file: authorized_keys
  user: vncuser
  allow_vnc: true

sftp:
  mode: read_write
  root: exchange
  max_file_size_mib: 1024

vnc:
  engine: ultravnc
  listen: "127.0.0.1:5900"
  executable: backends/windows/ultravnc/winvnc.exe
  view_only: false

audit: true
