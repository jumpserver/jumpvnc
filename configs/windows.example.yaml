ssh:
  listen: "0.0.0.0:5922"
  host_key_file: ssh_host_ed25519_key
  authorized_keys_file: authorized_keys
  user: vncuser
  allow_vnc: true

sftp:
  mode: read_write
  root: "~" # Remote Agent user's USERPROFILE (also the default when omitted).
  max_file_size_mib: 1024

vnc:
  compatibility:
    enabled: false # Optional plain VNC Viewer access, without SSH encryption.
    # listen: "0.0.0.0:5923" # Default when enabled: ssh.listen host and port + 1.
  engine: libvncserver
  listen: "127.0.0.1:5900"
  executable: backends/windows/svnc-desktop.exe
  password_file: vnc-password.txt
  view_only: false

audit: true
